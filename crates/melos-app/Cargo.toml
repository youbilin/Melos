[package]
name = "melos-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "melos"
path = "src/main.rs"

[dependencies]
melos-api = { path = "../melos-api" }
melos-core = { path = "../melos-core" }
melos-player = { path = "../melos-player" }
gpui = { package = "gpui-unofficial", version = "=1.28.0-pre" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.28.0-pre" }
tokio.workspace = true
tracing.workspace = true
unicode-segmentation = "1"
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Media_Playback",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }
