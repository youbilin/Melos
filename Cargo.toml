[workspace]
resolver = "2"
members = [
    "crates/melos-api",
    "crates/melos-core",
    "crates/melos-player",
    "crates/melos-app",
    "crates/melos-tui",
]

[workspace.package]
version = "0.1.10"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "native-tls", "http2", "charset"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
